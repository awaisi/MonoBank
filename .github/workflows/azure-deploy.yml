name: Build, test, and deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  # Set the repository variable AZURE_LOCATION to override the region.
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      azure_configured: ${{ steps.gate.outputs.configured }}
    steps:
      - name: Check Azure deployment secrets
        id: gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_CLIENT_ID is not set; deployment will be skipped. Run the 'Bootstrap Azure (one-time)' workflow first."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build container image
        run: docker build -t monobank:ci .

  deploy:
    needs: build
    if: needs.build.outputs.azure_configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.app.outputs.webAppUrl }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register resource providers
        run: |
          for ns in Microsoft.App Microsoft.ContainerRegistry Microsoft.OperationalInsights; do
            az provider register --namespace "$ns" --wait
          done

      - name: Deploy shared infrastructure (Bicep)
        id: infra
        run: |
          set -euo pipefail
          out=$(az deployment sub create \
            --name "monobank-infra-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" deployApp=false \
            --query properties.outputs -o json)
          echo "registryName=$(jq -r .registryName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "registryLoginServer=$(jq -r .registryLoginServer.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.infra.outputs.registryLoginServer }}
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.infra.outputs.registryName }}"
          image="$REGISTRY/monobank:${GITHUB_SHA}"
          docker build -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy container app (Bicep)
        id: app
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          out=$(az deployment sub create \
            --name "monobank-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" deployApp=true containerImage="$IMAGE" \
            --query properties.outputs -o json)
          url=$(jq -r .webAppUrl.value <<<"$out")
          echo "webAppUrl=$url" >> "$GITHUB_OUTPUT"
          echo "### MonoBank deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify /health
        run: |
          url="${{ steps.app.outputs.webAppUrl }}/health"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url"; then
              echo; echo "Healthy: $url"; exit 0
            fi
            echo "Attempt $i: not healthy yet"; sleep 10
          done
          echo "App did not become healthy at $url" >&2
          exit 1
