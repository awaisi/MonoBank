name: Build, test, and deploy to Azure

on:
  push:
    branches: [main]
  # Pull requests run the build job only (checks, tests, coverage gate, browser tests); deploys happen on main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Deploys queue one at a time; a pull request only cancels its own older runs.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'azure-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Set the repository variable AZURE_LOCATION to override the region.
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}
  # Custom hostname served from Cloudflare DNS. Set the repository variable
  # CUSTOM_DOMAIN to change it, or to "none" to disable.
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'monobank.divviq.app' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      azure_configured: ${{ steps.gate.outputs.configured }}
    steps:
      - name: Check Azure deployment secrets
        id: gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_CLIENT_ID is not set; deployment will be skipped. Run the 'Bootstrap Azure (one-time)' workflow first."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Coverage gate (100% lines on core modules)
        run: npm run coverage:check
      # The repo has no dependencies: Playwright is installed in a scratch folder and found through NODE_PATH.
      - name: Install Playwright outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
      - name: Browser end-to-end tests
        env:
          E2E_REQUIRED: '1'
        run: npm run e2e
      - name: Build container image
        run: docker build -t monobank:ci .

  deploy:
    needs: build
    if: needs.build.outputs.azure_configured == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.domain.outputs.domain && format('https://{0}', steps.domain.outputs.domain) || steps.app.outputs.webAppUrl }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI Container Apps extension
        run: az extension add --name containerapp --upgrade --yes --only-show-errors

      - name: Register resource providers
        run: |
          for ns in Microsoft.App Microsoft.ContainerRegistry Microsoft.OperationalInsights; do
            az provider register --namespace "$ns" --wait
          done

      - name: Deploy shared infrastructure (Bicep)
        id: infra
        run: |
          set -euo pipefail
          out=$(az deployment sub create \
            --name "monobank-infra-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" deployApp=false \
            --query properties.outputs -o json)
          for key in resourceGroupName registryName registryLoginServer appName \
                     environmentName environmentDefaultDomain customDomainVerificationId; do
            echo "$key=$(jq -r ".$key.value" <<<"$out")" >> "$GITHUB_OUTPUT"
          done

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.infra.outputs.registryLoginServer }}
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.infra.outputs.registryName }}"
          image="$REGISTRY/monobank:${GITHUB_SHA}"
          docker build -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Configure custom domain DNS (Cloudflare)
        id: domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          RG: ${{ steps.infra.outputs.resourceGroupName }}
          ENV_NAME: ${{ steps.infra.outputs.environmentName }}
          APP_FQDN: ${{ steps.infra.outputs.appName }}.${{ steps.infra.outputs.environmentDefaultDomain }}
          VERIFICATION_ID: ${{ steps.infra.outputs.customDomainVerificationId }}
        run: |
          set -euo pipefail
          if [ -z "$CUSTOM_DOMAIN" ] || [ "$CUSTOM_DOMAIN" = "none" ]; then
            echo "domain=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID secrets are not set; skipping custom domain $CUSTOM_DOMAIN."
            echo "domain=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          infra/cloudflare-dns.sh CNAME "$CUSTOM_DOMAIN" "$APP_FQDN"
          infra/cloudflare-dns.sh TXT "asuid.$CUSTOM_DOMAIN" "$VERIFICATION_ID"

          echo "Waiting for public DNS..."
          for i in $(seq 1 30); do
            cname=$(dig +short CNAME "$CUSTOM_DOMAIN" @1.1.1.1 | sed 's/\.$//')
            txt=$(dig +short TXT "asuid.$CUSTOM_DOMAIN" @1.1.1.1 | tr -d '"')
            if [ "$cname" = "$APP_FQDN" ] && [ "$txt" = "$VERIFICATION_ID" ]; then
              echo "DNS ready"; break
            fi
            [ "$i" -eq 30 ] && { echo "DNS records did not propagate" >&2; exit 1; }
            sleep 10
          done

          cert_id=$(az containerapp env certificate list -g "$RG" -n "$ENV_NAME" \
            --managed-certificates-only \
            --query "[?properties.subjectName=='$CUSTOM_DOMAIN' && properties.provisioningState=='Succeeded'].id | [0]" \
            -o tsv 2>/dev/null || true)
          echo "domain=$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "certificateId=$cert_id" >> "$GITHUB_OUTPUT"

      - name: Persistence probe (before deploy)
        id: probe
        env:
          APP_URL: https://${{ steps.infra.outputs.appName }}.${{ steps.infra.outputs.environmentDefaultDomain }}
        run: |
          # Create a game on the running app so we can prove it survives the
          # redeploy. Skipped until the running app persists games to disk.
          storage=$(curl -fsS --max-time 10 "$APP_URL/health" | jq -r '.storage // "none"' || true)
          echo "Running app storage: ${storage:-unreachable}"
          if [ "$storage" != "file" ]; then
            echo "Skipping persistence probe: the running app does not persist games yet."
            exit 0
          fi
          id=$(curl -fsS --max-time 10 -X POST -H 'content-type: application/json' \
            -d '{"players":["Deploy probe A","Deploy probe B"]}' "$APP_URL/api/games" | jq -r .id)
          echo "Created probe game $id"
          echo "gameId=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy container app (Bicep)
        id: app
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DOMAIN: ${{ steps.domain.outputs.domain }}
          CERT_ID: ${{ steps.domain.outputs.certificateId }}
        run: |
          set -euo pipefail
          out=$(az deployment sub create \
            --name "monobank-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" deployApp=true containerImage="$IMAGE" \
                         customDomain="$DOMAIN" customDomainCertificateId="$CERT_ID" \
            --query properties.outputs -o json)
          url=$(jq -r .webAppUrl.value <<<"$out")
          echo "webAppUrl=$url" >> "$GITHUB_OUTPUT"
          echo "### MonoBank deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Issue and bind managed certificate
        if: steps.domain.outputs.domain != '' && steps.domain.outputs.certificateId == ''
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          az containerapp hostname bind \
            --resource-group "${{ steps.infra.outputs.resourceGroupName }}" \
            --name "${{ steps.infra.outputs.appName }}" \
            --environment "${{ steps.infra.outputs.environmentName }}" \
            --hostname "$DOMAIN" \
            --validation-method CNAME \
            --output none

      - name: Verify /health and durable storage
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
          APP_URL: ${{ steps.app.outputs.webAppUrl }}
          PROBE_GAME: ${{ steps.probe.outputs.gameId }}
        run: |
          # Wait until the new revision answers and reports file storage
          # (the old revision may answer for a few seconds after the deploy).
          check() {
            local url="$1/health" body
            for i in $(seq 1 30); do
              if body=$(curl -fsS --max-time 10 "$url") && [ "$(jq -r .storage <<<"$body")" = "file" ]; then
                echo "$body"; echo "Healthy with durable storage: $url"; return 0
              fi
              echo "Attempt $i: not ready yet ($url) ${body:-}"; sleep 10
            done
            echo "App did not become healthy with file storage at $url" >&2
            return 1
          }
          check "$APP_URL"
          if [ -n "$DOMAIN" ]; then
            check "https://$DOMAIN"
            echo "### Custom domain: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$PROBE_GAME" ]; then
            if curl -fsS --max-time 10 "$APP_URL/api/games/$PROBE_GAME" > /dev/null; then
              echo "Probe game $PROBE_GAME survived the deploy."
              echo "Durable storage verified: a game created before the deploy survived it." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Probe game $PROBE_GAME was lost during the deploy." >&2
              exit 1
            fi
          fi
